version: '3.8'

services:
  incidentiq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incidentiq
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request as u; u.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
